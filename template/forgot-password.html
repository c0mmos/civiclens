<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicLens | Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../statics/css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand" style="margin-bottom: 8px;"><span class="brand-mark">C</span><span>CivicLens</span></div>
        <h2>Reset your password</h2>
        <p class="text-muted">Enter the email address associated with your account and we’ll send instructions to recover it.</p>
        <form style="margin-top: 20px;">
          <div class="form-block"><label>Email address</label><input class="form-control" type="email" value="elena@civiclens.org" /></div>
          <button class="btn btn-primary" style="width: 100%;" type="button">Send reset link</button>
        </form>
        <div class="form-note"><a href="login.html" class="auth-link">Back to login</a></div>
        <div class="success-box" style="margin-top: 20px;">A password reset email has been sent. Please check your inbox for the next steps.</div>
      </div>
    </div>
    <script src="../statics/js/main.js"></script>
  </body>
</html>

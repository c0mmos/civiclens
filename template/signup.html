<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicLens | Sign up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../statics/css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand" style="margin-bottom: 8px;"><span class="brand-mark">C</span><span>CivicLens</span></div>
        <h2>Create your account</h2>
        <p class="text-muted">Join the community and start reporting local issues.</p>
        <form style="margin-top: 20px;">
          <div class="form-grid">
            <div class="form-block"><label>First name</label><input class="form-control" type="text" value="Nina" /></div>
            <div class="form-block"><label>Last name</label><input class="form-control" type="text" value="Patel" /></div>
          </div>
          <div class="form-block"><label>Username</label><input class="form-control" type="text" value="nina.patel" /></div>
          <div class="form-block"><label>Email</label><input class="form-control" type="email" value="nina@example.com" /></div>
          <div class="form-block">
            <label>Password</label>
            <div style="position: relative;">
              <input id="signup-password" class="form-control" type="password" value="password123" />
              <button type="button" data-password-toggle="signup-password" class="btn btn-outline" style="position:absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: .48rem .74rem;">Show</button>
            </div>
          </div>
          <div class="form-block"><label>Confirm password</label><input class="form-control" type="password" value="password123" /></div>
          <div class="checkbox-row" style="margin-bottom: 18px;"><input type="checkbox" checked /> <span>I agree to the terms and conditions</span></div>
          <button class="btn btn-primary" style="width: 100%;" type="button">Create account</button>
        </form>
        <div class="form-note">Already have an account? <a href="login.html" class="auth-link">Log in</a></div>
      </div>
    </div>
    <script src="../statics/js/main.js"></script>
  </body>
</html>
